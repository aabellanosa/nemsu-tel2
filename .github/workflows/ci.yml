name: CI

on:
  push:
    branches:
      - main
      - render-postgres-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and deploy static prototype
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.NAMECHEAP_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.NAMECHEAP_FTP_SERVER_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Check Node server syntax
        run: node --check server.js

      - name: Check browser app syntax
        run: node --check public/app.js

      - name: Check migration script syntax
        run: node --check scripts/db-migrate.js

      - name: Check seed script syntax
        run: node --check scripts/db-seed.js

      - name: Deploy public folder to Namecheap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER_DIR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ${{ env.FTP_SERVER_DIR }}
