services:
  - type: web
    name: hmsystem
    env: node
    buildCommand: npm ci --include=dev && npm run build:css
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hmsystem-postgres
          property: connectionString

databases:
  - name: hmsystem-postgres
    databaseName: hmsystem
    user: hmsystem_user
